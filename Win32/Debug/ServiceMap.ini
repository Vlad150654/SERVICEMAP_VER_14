//ДОПОЛНИТЕЛЬНВЕ КОЛОНКИ РАСЧЕТНЫЕ (левую часть менять произвольно, сообщая мне)
//затем идут попарно колонки, служащие для группировок, цифры после знака равенства определяют номер алгоритма, прописанного в программе
//названия колонок значения не имеют, то есть их можно переназвать
//размер колонок должен ограничиваться 32 символами, пробелы в колонках недопустимы
//Группировка по координатам
id_Gdouble=01
Count_Gdouble=001
//Группировка по площадям
Area=02
Area_Count=002
Area_ID=0002
//Создание буферных зон, Группировка по буферам
Buffer_Area=03
Buffer_Count_Analog=003
Buffer_ID=0003
//Группировка по комментариям
Comment_Text=04
Comment_Count=004
Comment_ID=0004
//Группировка по расстояниям
id_Dist=05
Area_Dist=005
//УПКС
УПКС=06
УПКС_Count=006
УПКС_ID=0006
//Колонки для вычислений процентного совпадения по комментариям
Procent=07
Grup=007
CountGrup=0007
//колонки служащие для определения пересеченияsema буферов объектов с объектами из указанной таблицы, наванию таблицы предшествует слово Intersects
//колонки служащие для определения пересечения буферов объектов с объектами из указанной таблицы, наванию таблицы предшествует слово Intersects
Routes_name=Intersects Графика_Трассы;name
Routes_ref=Intersects Графика_Трассы;ref
Street_name=Intersects Графика_Улицы;name
Street_prfx=Intersects Графика_Улицы;prfx
//
//далее идут колонки служащие для определения вхождения объектов в определенную таблицу, наванию таблицы предшествует слово Contains
//название таблицы без расширения, заванчивается точкой с запятой
//если в табце необходимо извлечь данные из какого то поля, то необходимо указать его название
//в противном случае из таблицы берется только наличие записей (0 - нет записей; 1 - есть записи)
buffer=Contains Буфер_от500;
Water=Contains water_polygon;
Zone_IGS=Contains Зона_вляния_для_ИЖС;ITOG
//группа использует таблицу КП_Сад_сортировка, первая строка должна быть ID_КП_Сады
id_kpsad=Contains КП_Сад_сортировка;ID_КП_Сады
naim_kpsad=Contains КП_Сад_сортировка;название
Category_ZU=Contains КП_Сад_сортировка;категория_ЗУ
//группа использует таблицу НП_МО_код_2022, первая строка должна быть КодНП_МО
kod_np=Contains НП_МО_код_2022;КодНП_МО
naim_np=Contains НП_МО_код_2022;НаименованиеНП_МО
prfx=Contains НП_МО_код_2022;Префикс
id_mo=Contains НП_МО_код_2022;ID
//Проверяем Соответствие НП по колонкам Адрес,Адрес из парсинга,Название предложения и Комментарий
//проверка зависима от наличия предыдущей колонки (Name_MP_MO)
Correspondence_NP=011
pdf_path=012

